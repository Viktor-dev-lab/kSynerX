spring:
  application:
    name: kSynerX
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:cdms}}
    username: ${POSTGRES_USER:cdms}
    password: ${POSTGRES_PASSWORD:cdms_local_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

server:
  port: 8080

integrations:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
