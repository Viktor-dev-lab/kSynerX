name: ksynerx-cdms

x-java-service: &java-service
  env_file:
    - path: .env.example
    - path: .env
      required: false
  init: true
  stop_grace_period: 40s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdms}
      POSTGRES_USER: ${POSTGRES_USER:-cdms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdms_local_password}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  inventory-service:
    <<: *java-service
    image: ksynerx-inventory:local
    build:
      context: .
      args:
        APP_DIR: inventory-service
    restart: unless-stopped
    environment:
      INVENTORY_PORT: "8081"
      INVENTORY_STATE_FILE: /app/inventory-service/.data/inventory-products.json
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: ${DOCKER_INVENTORY_DATA_DIR:-./inventory-service/.data}
        target: /app/inventory-service/.data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  cdms:
    <<: *java-service
    image: ksynerx-cdms:local
    build:
      context: .
      args:
        APP_DIR: .
    restart: unless-stopped
    environment:
      CDMS_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cdms}
      POSTGRES_DB: ${POSTGRES_DB:-cdms}
      POSTGRES_USER: ${POSTGRES_USER:-cdms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdms_local_password}
      INVENTORY_BASE_URL: http://inventory-service:8081
    ports:
      - "127.0.0.1:${CDMS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
